{% set name = "morepath" %}
{% set version = "0.20" %}
{% set sha256 = "87b5778143686ac38b55b87183cfca5195f974777cfc45f6f8986c1eba0b35b8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools

  run:
    - python >={{ python_min }}
    - webob >=1.7.0
    - reg >=0.12
    - dectate >=0.14
    - importscan >=0.2
    - setuptools

test:
  requires:
    - python {{ python_min }}
  imports:
    - morepath

about:
  home: http://morepath.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'A micro web-framework with superpowers'
  description: |
    Morepath is a Python web framework. An application consists of models. Each
    type of model is published on a URL path. Content is exposed to the web
    using views.
  doc_url: http://morepath.readthedocs.io/
  dev_url: https://github.com/morepath/morepath

extra:
  recipe-maintainers:
    - stuertz
